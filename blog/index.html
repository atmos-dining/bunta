<meta charset="utf-8">

<meta name="description" content="大衆焼肉ぶんたのブログ・お知らせ一覧。最新情報や来店前に役立つ情報を更新しています。">

<meta property="og:type" content="article">
<meta property="og:site_name" content="大衆焼肉ぶんた">
<meta property="og:title" content="ブログ・お知らせ｜大衆焼肉ぶんた">
<meta property="og:description" content="大衆焼肉ぶんたのブログ・お知らせ一覧。最新情報や来店前に役立つ情報を更新しています。">
<meta property="og:url" content="https://yakiniku-bunta.com/blog/">

<body data-page="blog">
<div id="top"></div>

<!-- 共通ヘッダー -->
<div id="shared-header"></div>

<main id="main">

  <section class="section is-inview page-head" style="padding-top: calc(var(--header-h, 80px) + 16px) !important;">
    <div class="section-inner">
      <h1 class="page-title">ブログ・お知らせ</h1>
      <p class="page-lead">ご宴会情報・初めての方向けのご案内など、来店前に役立つ情報を発信しています。</p>
    </div>
  </section>

  <section class="section is-inview">
    <div class="section-inner">
      <div id="blogList" class="blog-grid"></div>
      <p id="blogStatus" style="margin-top:14px; opacity:.75;"></p>
    </div>
  </section>

  <!-- 共通フッター -->
  <div id="shared-bottom"></div>
  <a href="#top" class="page-top" aria-label="ページの先頭へ戻る">＾</a>

</main>

<!-- blog/ は1階層下なので ../common.js -->
<script src="../common.js"></script>
<script>
(async () => {
  const listEl   = document.getElementById('blogList');
  const statusEl = document.getElementById('blogStatus');

  function esc(s){
    return String(s ?? '')
      .replaceAll('&','&amp;').replaceAll('<','&lt;')
      .replaceAll('>','&gt;').replaceAll('"','&quot;');
  }
  function fmtDate(d){
    const m = String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? `${m[1]}.${m[2]}.${m[3]}` : esc(d||'');
  }

  try {
    if (statusEl) statusEl.textContent = '読み込み中…';

    const res = await fetch('./posts.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('posts.jsonが読み込めません（' + res.status + '）');
    const data = await res.json();
    const posts = data.posts ?? data;
    if (!Array.isArray(posts)) throw new Error('posts.jsonの形式が不正です');

    posts.sort((a, b) => String(b.date||'').localeCompare(String(a.date||'')));

    if (posts.length === 0) {
      if (statusEl) statusEl.textContent = 'まだ記事がありません。';
      return;
    }

    listEl.innerHTML = posts.map(p => {
      const href = `./posts/post.html?slug=${encodeURIComponent(p.slug)}`;
      const bg = p.image ? `style="background-image:url('${esc(p.image)}');"` : '';
      return `
        <article class="blog-card">
          <a href="${href}">
            <div class="blog-image" ${bg}></div>
            <div class="blog-body">
              <time class="blog-date" datetime="${esc(p.date)}">${fmtDate(p.date)}</time>
              <h3 class="blog-title">${esc(p.title)}</h3>
              <p class="blog-excerpt">${esc(p.excerpt)}</p>
            </div>
          </a>
        </article>`;
    }).join('');

    if (statusEl) statusEl.textContent = '';

  } catch(e) {
    if (statusEl) statusEl.textContent = 'エラー：' + (e?.message || e);
    console.error(e);
  }
})();
</script>

</body>
</html>
